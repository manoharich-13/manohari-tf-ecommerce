<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cart - Simple Shop</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="manohari-tf-style.css">
</head>
<body>
  <header>
    <div class="brand">
      <div class="brand-mark">S</div>
      <div>
        <p class="brand-title">Simple Shop</p>
        <p class="brand-subtitle">Your cart</p>
      </div>
    </div>
    <div class="nav-actions">
      <a class="button-link" href="manohari-tf-index.html">Home</a>
      <a class="button-link" href="manohari-tf-products.html">Products</a>
      <a class="button-link" href="manohari-tf-payment.html">Payment</a>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Review & update your cart</h1>
      <p>Adjust quantities and proceed to payment when you're ready.</p>
    </section>

    <section class="card">
      <h2>Cart items</h2>
      <div id="cartItems" style="margin-top: 14px; display: grid; gap: 12px;"></div>

      <div id="cartEmpty" class="message info" style="display:none;">
        Your cart is empty. Add items from the products page.
      </div>

      <div id="cartSummary" class="summary-row" style="display:none;">
        <div>
          <div style="font-weight:700;">Total</div>
          <div style="color: var(--muted);">Amount payable</div>
        </div>
        <div style="font-weight:800; font-size: 1.25rem;">₹<span id="cartTotal">0</span></div>
      </div>

      <div id="cartActions" style="display:none;">
        <div class="summary-row" style="border-top:none; padding-top: 0; margin-top: 12px;">
          <button class="checkout-btn" onclick="goToPayment()" id="checkoutBtn">Proceed to payment</button>
          <button style="background: rgba(255,255,255,0.18); color: #4f6cff; border: 1px solid rgba(79, 108, 255, 0.24);" class="checkout-btn" onclick="clearCart()" id="clearBtn">Clear cart</button>
        </div>
        <div id="cartMessage"></div>
      </div>
    </section>
  </main>

  <div class="footer">© 2026 Simple Shop</div>

  <script>
    // Authentication utilities
    function getCurrentUser() {
      try {
        const user = localStorage.getItem('currentUser');
        return user ? JSON.parse(user) : null;
      } catch (e) {
        return null;
      }
    }

    function checkAuth() {
      const user = getCurrentUser();
      if (!user) {
        window.location.href = 'manohari-tf-login.html';
        return null;
      }
      return user;
    }

    const cart_url = "https://kqprjormee.execute-api.ap-southeast-1.amazonaws.com/dev/cart";
    // Note: Some backends use a different endpoint for clearing cart.
    // If your backend doesn't support this, the button will fail gracefully.
    const urls = {
      cart: cart_url
    };

    let currentUser = null;

    function parseCartResponse(data) {
      // Backend may respond as { body: "[...]" } or as a raw array.
      try {
        if (data && typeof data.body === 'string') return JSON.parse(data.body);
      } catch (e) {}
      return data && data.body ? data.body : data;
    }

    function renderCart(cart) {
      const cartItemsEl = document.getElementById('cartItems');
      const cartEmptyEl = document.getElementById('cartEmpty');
      const cartSummaryEl = document.getElementById('cartSummary');
      const cartActionsEl = document.getElementById('cartActions');
      const cartTotalEl = document.getElementById('cartTotal');
      const cartMessageEl = document.getElementById('cartMessage');

      cartItemsEl.innerHTML = '';
      cartMessageEl.innerHTML = '';

      const safeCart = Array.isArray(cart) ? cart : [];
      if (safeCart.length === 0) {
        cartEmptyEl.style.display = 'block';
        cartSummaryEl.style.display = 'none';
        cartActionsEl.style.display = 'none';
        return;
      }

      cartEmptyEl.style.display = 'none';

      const total = safeCart.reduce((sum, item) => sum + (Number(item.total_price) || 0), 0);
      cartTotalEl.textContent = total;
      cartSummaryEl.style.display = 'flex';
      cartActionsEl.style.display = 'block';

      cartItemsEl.innerHTML = safeCart.map(item => {
        const lineTotal = Number(item.total_price) || 0;
        const qty = Number(item.quantity) || 0;
        const itemName = item.product_name || item.name || `Item ${item.item_id || item.id || ''}`;
        const itemId = item.item_id || item.id;
        return `
          <div class="cart-item">
            <div>
              <div style="font-weight:800; margin-bottom: 6px;">${itemName}</div>
              <div class="cart-meta">Price: ₹${item.price ?? ''} • Qty: ${qty}</div>
              <div class="cart-meta">Line total: ₹${lineTotal}</div>
            </div>
            <div style="display:flex; flex-direction:column; align-items:flex-end; gap:8px;">
              <div style="display:flex; gap:8px; align-items:center;">
                <button type="button" onclick="updateQty('${itemId}', ${qty - 1})">−</button>
                <span style="min-width: 28px; text-align:center; font-weight:800;">${qty}</span>
                <button type="button" onclick="updateQty('${itemId}', ${qty + 1})">+</button>
              </div>
              <button type="button" onclick="removeItem('${itemId}')">Remove</button>
            </div>
          </div>`;
      }).join('');
    }

    function getCart() {
      if (!currentUser) return;
      fetch(`${urls.cart}?userId=${currentUser.user_id}`)
        .then(res => res.json())
        .then(data => {
          const cart = parseCartResponse(data);
          renderCart(cart);
        })
        .catch(() => {
          document.getElementById('cartMessage').innerHTML = '<div class="message error">Unable to load cart.</div>';
        });
    }

    function updateQty(itemId, newQty) {
      const qty = Number(newQty);
      if (!Number.isFinite(qty)) return;

      // If qty <= 0, interpret as remove.
      if (qty <= 0) {
        removeItem(itemId);
        return;
      }

      fetch(urls.cart, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: currentUser.user_id, itemId, quantity: qty })
      })
        .then(() => {
          getCart();
        })
        .catch(() => {
          document.getElementById('cartMessage').innerHTML = '<div class="message error">Failed to update quantity.</div>';
        });
    }

    function removeItem(itemId) {
      fetch(urls.cart, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: currentUser.user_id, itemId })
      })
        .then(() => {
          getCart();
        })
        .catch(() => {
          document.getElementById('cartMessage').innerHTML = '<div class="message error">Failed to remove item.</div>';
        });
    }

    function clearCart() {
      fetch(urls.cart, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ userId: currentUser.user_id })
      })
        .then(() => {
          getCart();
          document.getElementById('cartMessage').innerHTML = '<div class="message success">Cart cleared.</div>';
        })
        .catch(() => {
          document.getElementById('cartMessage').innerHTML = '<div class="message error">Failed to clear cart.</div>';
        });
    }

    function goToPayment() {
      window.location.href = 'manohari-tf-payment.html';
    }

    window.addEventListener('DOMContentLoaded', () => {
      currentUser = checkAuth();
      if (currentUser) getCart();

      // Cache navigation state
      document.getElementById('checkoutBtn').disabled = false;
    });
  </script>
</body>
</html>
